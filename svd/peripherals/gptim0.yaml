      size: '32'
      access: read-write
      fields:
        field:
          - name: CCR3
            description: capture compare 3 value, 16-bit
            bitOffset: '0'
            bitWidth: '16'

    - name: DCR
      description: GPTIM DMA control register, Address
      addressOffset: '0x48'
      size: '32'
      access: read-write
      fields:
        field:
          name: DBL_POSITION
          description: Dbl position
          bitOffset: '3'
          bitWidth: '1'
    - name: DMAR
      description: GPTIM DMA address for full transfer register, Address
      addressOffset: '0x4C'
      size: '32'
      access: read-write
    - name: OR
      description: GPTIM option register, Address
      addressOffset: '0x50'
      size: '32'
      access: read-write
