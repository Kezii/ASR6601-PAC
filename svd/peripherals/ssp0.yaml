name: SSP0
description: Ssp0
baseAddress: '0x40006000'
addressBlock:
  offset: '0'
  size: '0x1000'
  usage: registers
interrupt:
  name: SSP0
  value: '10'
registers:
  register:
    - name: CR0
      description: control register 0
      addressOffset: '0x0'
      size: '32'
      access: read-write
      fields:
        field:
          - name: DSS
            description: data width setting
            bitOffset: '0'
            bitWidth: '4'
            enumeratedValues:
              enumeratedValue:
                - name: VALUE_4
                  description: 4-bit data
                  value: '0x3'
                - name: VALUE_5
                  description: 5-bit data
                  value: '0x4'
                - name: VALUE_6
                  description: 6-bit data
                  value: '0x5'
                - name: VALUE_7
                  description: 7-bit data
                  value: '0x6'
                - name: VALUE_8
                  description: 8-bit data
                  value: '0x7'
                - name: VALUE_9
                  description: 9-bit data
                  value: '0x8'
                - name: VALUE_10
                  description: 10-bit data
                  value: '0x9'
                - name: VALUE_11
                  description: 11-bit data
                  value: '0xA'
                - name: VALUE_12
                  description: 12-bit data
                  value: '0xB'
                - name: VALUE_13
                  description: 13-bit data
                  value: '0xC'
                - name: VALUE_14
                  description: 14-bit data
                  value: '0xD'
                - name: VALUE_15
                  description: 15-bit data
                  value: '0xE'
                - name: VALUE_16
                  description: 16-bit data
                  value: '0xF'
          - name: FRF
            description: frame format setting
            bitOffset: '4'
            bitWidth: '2'
            enumeratedValues:
              enumeratedValue:
                - name: MOTOROLA
                  description: Motorola SPI
                  value: '0x0'
                - name: TI
                  description: Texas Instruments SPI
                  value: '0x1'
                - name: MICROWIRE
                  description: National Semiconductor Microwire
                  value: '0x2'
          - name: SPO
            description: ssp polarity setting
            bitOffset: '6'
            bitWidth: '1'
          - name: SPH
            description: ssp phase setting
            bitOffset: '7'
            bitWidth: '1'
          - name: SCR
            description: serial clock rate
            bitOffset: '8'
            bitWidth: '8'
    - name: CR1
      description: control register 1
      addressOffset: '0x4'
      size: '32'
      access: read-write
      fields:
        field:
          - name: LBM
            description: loopback mode
            bitOffset: '0'
            bitWidth: '1'
          - name: SSE
            description: ssp enable
            bitOffset: '1'
            bitWidth: '1'
          - name: MS
            description: master/slave mode selection
            bitOffset: '2'
            bitWidth: '1'
            enumeratedValues:
              enumeratedValue:
                - name: MASTER
                  description: master mode
                  value: '0x0'
                - name: SLAVE
                  description: slave mode
                  value: '0x1'
          - name: SOD
            description: ssp output disable in slave mode
            bitOffset: '3'
            bitWidth: '1'
    - name: DR
      description: data register
      addressOffset: '0x8'
      size: '32'
      access: read-write
      fields:
        field:
          - name: DATA
            description: ssp tx/rx data
            bitOffset: '0'
            bitWidth: '16'
    - name: SR
      description: status register
      addressOffset: '0xC'
      size: '32'
      access: read-only
      fields:
        field:
          - name: TFE
            description: transmit fifo empty
            bitOffset: '0'
            bitWidth: '1'
          - name: TNF
            description: transmit fifo not full
            bitOffset: '1'
            bitWidth: '1'
          - name: RNE
            description: receive fifo not empty
            bitOffset: '2'
            bitWidth: '1'
          - name: RFF
            description: receive fifo full
            bitOffset: '3'
            bitWidth: '1'
          - name: BSY
            description: ssp busy
            bitOffset: '4'
            bitWidth: '1'
    - name: CPSR
      description: clock prescale register
      addressOffset: '0x10'
      size: '32'
      access: read-write
      fields:
        field:
          - name: CPSDVSR
            description: clock prescale divisor, even number 2 to 254
            bitOffset: '0'
            bitWidth: '8'
    - name: IMSC
      description: interrupt mask set or clear register
      addressOffset: '0x14'
      size: '32'
      access: read-write
      fields:
        field:
          - name: RORIM
            description: receive overrun interrupt mask
            bitOffset: '0'
            bitWidth: '1'
          - name: RTIM
            description: receive timeout interrupt mask
            bitOffset: '1'
            bitWidth: '1'
          - name: RXIM
            description: receive interrupt mask
            bitOffset: '2'
            bitWidth: '1'
          - name: TXIM
            description: transmit interrupt mask
            bitOffset: '3'
            bitWidth: '1'
    - name: RIS
      description: raw interrupt status register
      addressOffset: '0x18'
      size: '32'
      access: read-only
      fields:
        field:
          - name: RORRIS
            description: receive overrun interrupt raw status
            bitOffset: '0'
            bitWidth: '1'
          - name: RTRIS
            description: receive timeout interrupt raw status
            bitOffset: '1'
            bitWidth: '1'
          - name: RXRIS
            description: receive interrupt raw status
            bitOffset: '2'
            bitWidth: '1'
          - name: TXRIS
            description: transmit interrupt raw status
            bitOffset: '3'
            bitWidth: '1'
    - name: MIS
      description: masked interrupt status register
      addressOffset: '0x1C'
      size: '32'
      access: read-only
      fields:
        field:
          - name: RORMIS
            description: receive overrun interrupt masked status
            bitOffset: '0'
            bitWidth: '1'
          - name: RTMIS
            description: receive timeout interrupt masked status
            bitOffset: '1'
            bitWidth: '1'
          - name: RXMIS
            description: receive interrupt masked status
            bitOffset: '2'
            bitWidth: '1'
          - name: TXMIS
            description: transmit interrupt masked status
            bitOffset: '3'
            bitWidth: '1'
    - name: ICR
      description: interrupt clear register
      addressOffset: '0x20'
      size: '32'
      access: write-only
      fields:
        field:
          - name: RORIC
            description: receive overrun interrupt clear
            bitOffset: '0'
            bitWidth: '1'
          - name: RTIC
            description: receive timeout interrupt clear
            bitOffset: '1'
            bitWidth: '1'
    - name: DMA_CR
      description: DMA control register
      addressOffset: '0x24'
      size: '32'
      access: read-write
      fields:
        field:
          - name: RXDMAE
            description: dma rx enable
            bitOffset: '0'
            bitWidth: '1'
          - name: TXDMAE
            description: dma tx enable
            bitOffset: '1'
            bitWidth: '1'
    - name: PERIPH_ID0
      description: peripheral identification register 0
      addressOffset: '0xFE0'
      size: '32'
      access: read-only
    - name: PERIPH_ID1
      description: peripheral identification register 1
      addressOffset: '0xFE4'
      size: '32'
      access: read-only
    - name: PERIPH_ID2
      description: peripheral identification register 2
      addressOffset: '0xFE8'
      size: '32'
      access: read-only
    - name: PERIPH_ID3
      description: peripheral identification register 3
      addressOffset: '0xFEC'
      size: '32'
      access: read-only
    - name: PCELL_ID0
      description: prime cell identification register 0
      addressOffset: '0xFF0'
      size: '32'
      access: read-only
    - name: PCELL_ID1
      description: prime cell identification register 1
      addressOffset: '0xFF4'
      size: '32'
      access: read-only
    - name: PCELL_ID2
      description: prime cell identification register 2
      addressOffset: '0xFF8'
      size: '32'
      access: read-only
    - name: PCELL_ID3
      description: prime cell identification register 3
      addressOffset: '0xFFC'
      size: '32'
      access: read-only
