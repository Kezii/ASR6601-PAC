                  description: Rising falling edge
                  value: '0x2'
          - name: WAVE_SEL
            description: Wave sel
            bitOffset: '8'
            bitWidth: '2'
            enumeratedValues:
              enumeratedValue:
                - name: NOISE
                  description: Noise
                  value: '0x1'
                - name: NONE
                  description: None
                  value: '0x0'
                - name: TRIANGLE
                  description: Triangle
                  value: '0x2'
          - name: MASK_AMP_SEL
            description: Mask amp sel
            bitOffset: '10'
