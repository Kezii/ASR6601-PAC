                  description: Value 1023
                  value: '0x9'
                - name: VALUE_127
                  description: Value 127
                  value: '0x6'
                - name: VALUE_15
                  description: Value 15
                  value: '0x3'
                - name: VALUE_255
                  description: Value 255
