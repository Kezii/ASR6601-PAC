      description: control register
      addressOffset: '0x0'
      size: '32'
      access: read-write
      fields:
        field:
          - name: DAC_EN
            description: Dac en
            bitOffset: '0'
            bitWidth: '1'
          - name: TRIG_EN
            description: Trig en
            bitOffset: '2'
            bitWidth: '1'
          - name: TRIG_SRC_SEL
            description: Trig src sel
            bitOffset: '3'
            bitWidth: '3'
            enumeratedValues:
              enumeratedValue:
                - name: BSTIMER0_TRGO
                  description: Bstimer0 trgo
                  value: '0x3'
                - name: BSTIMER1_TRGO
                  description: Bstimer1 trgo
                  value: '0x2'
                - name: GPIO24
                  description: Gpio24
                  value: '0x5'
                - name: GPIO43
                  description: Gpio43
                  value: '0x6'
                - name: GPIO6
                  description: Gpio6
                  value: '0x4'
                - name: GPTIMER0_TRGO
                  description: Gptimer0 trgo
                  value: '0x1'
                - name: GPTIMER1_TRGO
                  description: Gptimer1 trgo
                  value: '0x0'
                - name: SOFTWARE
                  description: Software
                  value: '0x7'
