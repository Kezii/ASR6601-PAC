name: SEC
description: Security controller
baseAddress: '0x4000F000'
addressBlock:
  offset: '0'
  size: '0x1C'
  usage: registers
interrupt:
  - name: SEC
    value: '0'
  - name: SCC
    description: SDK SCC interrupt vector; SDK does not publish an SCC MMIO base
    value: '15'
registers:
  register:
    - name: INT
      description: interrupt enable register
      addressOffset: '0x0'
      size: '32'
      access: read-write
    - name: RST
      description: reset enable register
      addressOffset: '0x4'
      size: '32'
      access: read-write
    - name: SR
      description: status
      addressOffset: '0x8'
      size: '32'
      access: read-write
      fields:
        field:
          name: FLASH_ACCESS_ERROR
          description: Flash access error
          bitOffset: '12'
          bitWidth: '1'
    - name: FILTER0
      description: filter0
      addressOffset: '0xC'
      size: '32'
      access: read-write
    - name: FILTER1
      description: filter1
      addressOffset: '0x10'
      size: '32'
      access: read-write
    - name: FILTER2
      description: filter2
      addressOffset: '0x14'
      size: '32'
      access: read-write
    - name: FILTER3
      description: filter3
      addressOffset: '0x18'
      size: '32'
      access: read-write
