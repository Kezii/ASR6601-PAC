name: PWR
description: Power controller
baseAddress: '0x40001800'
addressBlock:
  offset: '0'
  size: '0x20'
  usage: registers
interrupt:
  name: PWR
  value: '34'
registers:
  register:
    - name: CR0
      description: control register 0
      addressOffset: '0x0'
      size: '32'
      access: read-write
      fields:
        field:
          - name: LOW_POWER_MODE
            description: Low-power mode selection
            bitOffset: '0'
            bitWidth: '2'
          - name: WFE
            description: Wait for event selection, set for WFE, clear for WFI
            bitOffset: '5'
            bitWidth: '1'

    - name: CR1
      description: control register 1
      addressOffset: '0x4'
      size: '32'
      access: read-write
      fields:
        field:
          - name: TRIM
            description: Regulator trim value
            bitOffset: '20'
            bitWidth: '4'
          - name: LP_MODE_EXT
            description: Low-power mode extension, Stop3 versus Standby select
            bitOffset: '24'
            bitWidth: '1'

    - name: SR0
      description: status register 0
      addressOffset: '0x8'
      size: '32'
      access: read-write
    - name: SR1
      description: status register 1
      addressOffset: '0xC'
      size: '32'
      access: read-write
    - name: CR2
      description: control register 2
      addressOffset: '0x10'
      size: '32'
      access: read-write
    - name: CR3
      description: control register 3
      addressOffset: '0x14'
      size: '32'
      access: read-write
    - name: CR4
      description: control register 4
      addressOffset: '0x18'
      size: '32'
      access: read-write
    - name: CR5
      description: control register 5
      addressOffset: '0x1C'
      size: '32'
      access: read-write
