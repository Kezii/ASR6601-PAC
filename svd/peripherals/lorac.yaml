name: LORAC
description: LoRa controller interface
baseAddress: '0x40009000'
addressBlock:
  offset: '0'
  size: '0x11C'
  usage: registers
interrupt:
  name: LORA
  value: '21'
registers:
  register:
    - name: SSP_CR0
      description: ssp control register 0
      addressOffset: '0x0'
      size: '32'
      access: read-write
      fields:
        field:
          - name: DSS
            description: data width setting
            bitOffset: '0'
            bitWidth: '4'
            enumeratedValues:
              enumeratedValue:
                - name: VALUE_4
                  description: 4-bit data
                  value: '0x3'
                - name: VALUE_5
                  description: 5-bit data
                  value: '0x4'
                - name: VALUE_6
                  description: 6-bit data
                  value: '0x5'
                - name: VALUE_7
                  description: 7-bit data
                  value: '0x6'
                - name: VALUE_8
                  description: 8-bit data
                  value: '0x7'
                - name: VALUE_9
                  description: 9-bit data
                  value: '0x8'
                - name: VALUE_10
                  description: 10-bit data
                  value: '0x9'
                - name: VALUE_11
                  description: 11-bit data
                  value: '0xA'
                - name: VALUE_12
                  description: 12-bit data
                  value: '0xB'
                - name: VALUE_13
                  description: 13-bit data
                  value: '0xC'
                - name: VALUE_14
                  description: 14-bit data
                  value: '0xD'
                - name: VALUE_15
                  description: 15-bit data
                  value: '0xE'
                - name: VALUE_16
                  description: 16-bit data
                  value: '0xF'
          - name: FRF
            description: frame format setting
            bitOffset: '4'
            bitWidth: '2'
            enumeratedValues:
              enumeratedValue:
                - name: MOTOROLA
                  description: Motorola SPI
                  value: '0x0'
                - name: TI
                  description: Texas Instruments SPI
                  value: '0x1'
                - name: MICROWIRE
                  description: National Semiconductor Microwire
                  value: '0x2'
          - name: SPO
            description: ssp polarity setting
            bitOffset: '6'
            bitWidth: '1'
          - name: SPH
            description: ssp phase setting
            bitOffset: '7'
            bitWidth: '1'
          - name: SCR
            description: serial clock rate
            bitOffset: '8'
            bitWidth: '8'
    - name: SSP_CR1
      description: ssp control register 1
      addressOffset: '0x4'
      size: '32'
      access: read-write
      fields:
        field:
          - name: LBM
            description: loopback mode
            bitOffset: '0'
            bitWidth: '1'
          - name: SSE
            description: ssp enable
            bitOffset: '1'
            bitWidth: '1'
          - name: MS
            description: master/slave mode selection
            bitOffset: '2'
            bitWidth: '1'
            enumeratedValues:
              enumeratedValue:
                - name: MASTER
                  description: master mode
                  value: '0x0'
                - name: SLAVE
                  description: slave mode
                  value: '0x1'
          - name: SOD
            description: ssp output disable in slave mode
            bitOffset: '3'
            bitWidth: '1'
    - name: SSP_DR
      description: ssp data register
      addressOffset: '0x8'
      size: '32'
      access: read-write
      fields:
        field:
          - name: DATA
            description: ssp tx/rx data
            bitOffset: '0'
            bitWidth: '16'
    - name: SSP_SR
      description: ssp status register
      addressOffset: '0xC'
      size: '32'
      access: read-only
      fields:
        field:
          - name: TFE
            description: tx fifo empty flag
            bitOffset: '0'
            bitWidth: '1'
          - name: TNF
            description: tx fifo not full flag
            bitOffset: '1'
            bitWidth: '1'
          - name: RNE
            description: rx fifo not empty flag
            bitOffset: '2'
            bitWidth: '1'
          - name: RFF
            description: rx fifo full flag
            bitOffset: '3'
            bitWidth: '1'
          - name: BSY
            description: ssp busy flag
            bitOffset: '4'
            bitWidth: '1'
    - name: SSP_CPSR
      description: ssp clock prescale register
      addressOffset: '0x10'
      size: '32'
      access: read-write
      fields:
        field:
          - name: CPSDVSR
            description: clock prescale divisor, even number 2 to 254
            bitOffset: '0'
            bitWidth: '8'
    - name: SSP_IMSC
      description: ssp interrupt mask set or clear register
      addressOffset: '0x14'
      size: '32'
      access: read-write
      fields:
        field:
          - name: RORIM
            description: receive overrun interrupt mask
            bitOffset: '0'
            bitWidth: '1'
          - name: RTIM
            description: receive timeout interrupt mask
            bitOffset: '1'
            bitWidth: '1'
          - name: RXIM
            description: receive interrupt mask
            bitOffset: '2'
            bitWidth: '1'
          - name: TXIM
            description: transmit interrupt mask
            bitOffset: '3'
            bitWidth: '1'
    - name: SSP_RIS
      description: ssp raw interrupt status register
      addressOffset: '0x18'
      size: '32'
      access: read-only
      fields:
        field:
          - name: RORRIS
            description: receive overrun interrupt raw status
            bitOffset: '0'
            bitWidth: '1'
          - name: RTRIS
            description: receive timeout interrupt raw status
            bitOffset: '1'
            bitWidth: '1'
          - name: RXRIS
            description: receive interrupt raw status
            bitOffset: '2'
            bitWidth: '1'
          - name: TXRIS
            description: transmit interrupt raw status
            bitOffset: '3'
            bitWidth: '1'
    - name: SSP_MIS
      description: ssp masked interrupt status register
      addressOffset: '0x1C'
      size: '32'
      access: read-only
      fields:
        field:
          - name: RORMIS
            description: receive overrun interrupt masked status
            bitOffset: '0'
            bitWidth: '1'
          - name: RTMIS
            description: receive timeout interrupt masked status
            bitOffset: '1'
            bitWidth: '1'
          - name: RXMIS
            description: receive interrupt masked status
            bitOffset: '2'
            bitWidth: '1'
          - name: TXMIS
            description: transmit interrupt masked status
            bitOffset: '3'
            bitWidth: '1'
    - name: SSP_ICR
      description: ssp interrupt clear register
      addressOffset: '0x20'
      size: '32'
      access: write-only
      fields:
        field:
          - name: RORIC
            description: receive overrun interrupt clear
            bitOffset: '0'
            bitWidth: '1'
          - name: RTIC
            description: receive timeout interrupt clear
            bitOffset: '1'
            bitWidth: '1'
    - name: SSP_DMA_CR
      description: ssp DMA control register
      addressOffset: '0x24'
      size: '32'
      access: read-write
      fields:
        field:
          - name: RXDMAE
            description: dma rx enable
            bitOffset: '0'
            bitWidth: '1'
          - name: TXDMAE
            description: dma tx enable
            bitOffset: '1'
            bitWidth: '1'
    - name: CR0
      description: control register 0
      addressOffset: '0x100'
      size: '32'
      access: read-write
      fields:
        field:
          - name: IRQ_DIG_INT_EN
            description: irq dig high level interrupt enable, bit per irq dig line
            bitOffset: '5'
            bitWidth: '3'
          - name: SCK_MOSI_SEL
            description: sck/mosi/miso source selection for rf trx
            bitOffset: '9'
            bitWidth: '1'
            enumeratedValues:
              enumeratedValue:
                - name: REG
                  description: from LORAC_SCK_CR, LORAC_MOSI_CR and LORAC_MISO_SR
                  value: '0x0'
                - name: INTERNAL_SSP
                  description: from internal ssp of LORAC
                  value: '0x1'
          - name: NSS_SEL
            description: nss source selection for rf trx
            bitOffset: '10'
            bitWidth: '1'
            enumeratedValues:
              enumeratedValue:
                - name: REG
                  description: from register LORAC_NSS_CR
                  value: '0x0'
                - name: INTERNAL_SSP
                  description: from internal ssp of LORAC
                  value: '0x1'
    - name: CR1
      description: control register 1
      addressOffset: '0x104'
      size: '32'
      access: read-write
      fields:
        field:
          - name: PWRTCXO_EN_BAT
            description: Pwr tcxo enable control
            bitOffset: '0'
            bitWidth: '1'
          - name: TCXO_EN_BAT
            description: Tcxo enable control
            bitOffset: '1'
            bitWidth: '1'
          - name: CLK_32M_EN_BAT
            description: Clk 32m enable control
            bitOffset: '2'
            bitWidth: '1'
          - name: NRESET_BAT
            description: Nreset bat control
            bitOffset: '5'
            bitWidth: '1'
          - name: POR_BAT
            description: Por bat control
            bitOffset: '7'
            bitWidth: '1'
    - name: SR
      description: status register
      addressOffset: '0x108'
      size: '32'
      access: read-only
      fields:
        field:
          - name: CLK_32M_RDY_BAT_SR
            description: clk 32m ready status
            bitOffset: '1'
            bitWidth: '1'
          - name: IRQ_DIG_SR
            description: irq dig status flag
            bitOffset: '5'
            bitWidth: '3'
          - name: BUSY_DIG_SR
            description: busy dig status flag
            bitOffset: '8'
            bitWidth: '1'
    - name: NSS_CR
      description: nss control register
      addressOffset: '0x10C'
      size: '32'
      access: read-write
      fields:
        field:
          - name: REG_NSS
            description: nss control bit
            bitOffset: '0'
            bitWidth: '1'
            enumeratedValues:
              enumeratedValue:
                - name: PULL_DOWN
                  description: pull down nss pin
                  value: '0x0'
                - name: PULL_UP
                  description: pull up nss pin
                  value: '0x1'
    - name: SCK_CR
      description: sck control register
      addressOffset: '0x110'
      size: '32'
      access: read-write
      fields:
        field:
          - name: REG_SCK
            description: sck control bit
            bitOffset: '0'
            bitWidth: '1'
            enumeratedValues:
              enumeratedValue:
                - name: PULL_DOWN
                  description: pull down sck pin
                  value: '0x0'
                - name: PULL_UP
                  description: pull up sck pin
                  value: '0x1'
    - name: MOSI_CR
      description: mosi control register
      addressOffset: '0x114'
      size: '32'
      access: read-write
      fields:
        field:
          - name: REG_MOSI
            description: mosi control bit
            bitOffset: '0'
            bitWidth: '1'
            enumeratedValues:
              enumeratedValue:
                - name: PULL_DOWN
                  description: pull down mosi pin
                  value: '0x0'
                - name: PULL_UP
                  description: pull up mosi pin
                  value: '0x1'
    - name: MISO_SR
      description: miso status register
      addressOffset: '0x118'
      size: '32'
      access: read-only
      fields:
        field:
          - name: REG_MISO
            description: miso status flag
            bitOffset: '0'
            bitWidth: '1'
            enumeratedValues:
              enumeratedValue:
                - name: LOW
                  description: low
                  value: '0x0'
                - name: HIGH
                  description: high
                  value: '0x1'
