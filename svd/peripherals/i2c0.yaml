      description: reset cycle register
      addressOffset: '0x18'
      size: '32'
      access: read-write
      fields:
        field:
          - name: RST_CYC
            description: serial bus reset scl cycle count
            bitOffset: '0'
            bitWidth: '4'
    - name: BMR
      description: bus monitor register
      addressOffset: '0x1C'
      size: '32'
      access: read-only
      fields:
        field:
          - name: SDA
            description: sda pin state
            bitOffset: '0'
            bitWidth: '1'
          - name: SCL
            description: scl pin state
            bitOffset: '1'
            bitWidth: '1'
    - name: WFIFO
      description: write fifo register
      addressOffset: '0x20'
      size: '32'
