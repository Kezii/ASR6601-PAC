      description: write fifo write pointer register
      addressOffset: '0x24'
      size: '32'
      access: read-write
      fields:
        field:
          - name: DATA
            description: position in the transmit fifo where software will write the next entry
            bitOffset: '0'
            bitWidth: '4'
    - name: WFIFO_RPTR
      description: write fifo read pointer register
      addressOffset: '0x28'
      size: '32'
      access: read-write
      fields:
        field:
          - name: DATA
            description: position in the transmit fifo where hardware will read the next entry
            bitOffset: '0'
            bitWidth: '4'
    - name: RFIFO
      description: read fifo register
      addressOffset: '0x2C'
      size: '32'
      access: read-only
      fields:
        field:
          - name: DATA
            description: i2c bus receive data for read transactions
            bitOffset: '0'
            bitWidth: '8'
    - name: RFIFO_WPTR
      description: read fifo write pointer register
      addressOffset: '0x30'
      size: '32'
      access: read-only
      fields:
        field:
          - name: DATA
            description: position in the receive fifo where hardware will write the next entry
            bitOffset: '0'
            bitWidth: '4'
    - name: RFIFO_RPTR
      description: read fifo read pointer register
      addressOffset: '0x34'
      size: '32'
      access: read-write
      fields:
        field:
          - name: DATA
            description: position in the receive fifo where software will read the next entry
            bitOffset: '0'
            bitWidth: '4'
