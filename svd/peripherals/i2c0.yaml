            description: Full
            bitOffset: '0'
            bitWidth: '1'
          - name: EMPTY
            description: Empty
            bitOffset: '1'
            bitWidth: '1'
          - name: SIZE
            description: Size
            bitOffset: '2'
            bitWidth: '4'
    - name: RFIFO_STATUS
      description: read fifo status register
      addressOffset: '0x44'
      size: '32'
      access: read-only
      fields:
        field:
          - name: OVERUN
            description: Overun
            bitOffset: '0'
            bitWidth: '1'
          - name: HFULL
            description: Hfull
            bitOffset: '1'
            bitWidth: '1'
          - name: FULL
            description: Full
            bitOffset: '2'
            bitWidth: '1'
          - name: EMPTY
            description: Empty
            bitOffset: '3'
            bitWidth: '1'
          - name: SIZE
