            description: i2c slave address
            bitOffset: '0'
            bitWidth: '7'
    - name: DBR
      description: data buffer register
      addressOffset: '0xC'
      size: '32'
      access: read-write
      fields:
        field:
          - name: DATA_BUFFER
            description: i2c bus transmit/receive data
            bitOffset: '0'
            bitWidth: '8'
    - name: LCR
      description: load count register
      addressOffset: '0x10'
      size: '32'
      access: read-write
      fields:
        field:
          - name: SLV
            description: phase decrementer load value for standard mode scl in master mode
            bitOffset: '0'
            bitWidth: '9'
          - name: FLV
            description: phase decrementer load value for fast mode scl in master mode
            bitOffset: '9'
            bitWidth: '9'
