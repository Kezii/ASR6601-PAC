device:
  vendor: ASR Microelectronics
  vendorID: ASR
  name: ASR6601
  series: ASR6601
  version: '1.1'
  description: ASR6601 LPWAN SoC family with Arm China STAR-MC1 processor. ASR6601SE
    has 256 KiB Flash and 64 KiB SRAM; ASR6601CB has 128 KiB Flash and 16 KiB SRAM.
  licenseText: Reverse-engineered device description derived from the ASR6601 datasheet
    and the ASR6601 SDK register declarations. Verify undocumented behavior against
    target hardware.
  cpu:
    name: CM4
    revision: r0p1
    endian: little
    mpuPresent: 'false'
    fpuPresent: 'true'
    vtorPresent: 'true'
    nvicPrioBits: '3'
    vendorSystickConfig: 'false'
  addressUnitBits: '8'
  width: '32'
  size: '32'
  access: read-write
  _xmlns:xsi: http://www.w3.org/2001/XMLSchema-instance
  _schemaVersion: '1.3'
  _xsi:noNamespaceSchemaLocation: CMSIS-SVD.xsd
