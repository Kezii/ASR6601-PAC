[package]
name = "asr6601-pac"
version = "0.1.2"
edition = "2021"
description = "Peripheral Access Crate for ASRmicro ASR6601 series microcontroller"
license = "MIT"

[dependencies]
critical-section = { version = "1.0", optional = true }
cortex-m = "0.7.6"
cortex-m-rt = { version = "0.7", optional = true }
vcell = "0.1.2"

[features]
rt = ["cortex-m-rt/device"]
